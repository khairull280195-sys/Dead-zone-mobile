name: Build DeadZone Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Prepare Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
      - name: Build debug APK
        run: |
          mkdir -p build
          keytool -genkeypair -v -keystore /tmp/deadzone-debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=DeadZone,C=BN"
          godot --headless --verbose --export-debug "Android" build/DeadZoneMobile.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeadZoneMobile-APK
          path: build/DeadZoneMobile.apk
          if-no-files-found: error
