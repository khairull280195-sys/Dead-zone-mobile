name: Build Dead Zone Mobile 2.0

on:
  push:
    branches: [ main ]
    paths:
      - 'v2/**'
      - '.github/workflows/build-v2-apk.yml'
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Download licensed animated human model
        run: |
          mkdir -p v2/assets
          wget -q --show-progress https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/glTF-Binary/CesiumMan.glb -O v2/assets/CesiumMan.glb
      - name: Configure export templates
        run: |
          TEMPLATE_APK=$(find /root /opt /usr -path '*4.3.stable/android_debug.apk' -print -quit)
          TEMPLATE_DIR=$(dirname "$TEMPLATE_APK")
          mkdir -p /github/home/.local/share/godot/export_templates/4.3.stable
          cp -a "$TEMPLATE_DIR"/. /github/home/.local/share/godot/export_templates/4.3.stable/
          mkdir -p /github/home/.android /github/home/.config/godot
          keytool -genkeypair -v -keystore /github/home/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          JAVA_PATH=$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")
          SDK_PATH=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "/github/home/.android/debug.keystore"\n' "$SDK_PATH" "$JAVA_PATH" > /github/home/.config/godot/editor_settings-4.tres
      - name: Import and export Android APK
        working-directory: v2
        run: |
          mkdir -p build
          {
            echo "HOME=$HOME"
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
            command -v java
            java -version
            command -v godot
            godot --version
            ls -la /github/home/.local/share/godot/export_templates/4.3.stable
            keytool -list -keystore /github/home/.android/debug.keystore -storepass android
          } > build/export.log 2>&1
          godot --headless --verbose --editor --quit-after 30 >> build/export.log 2>&1 || true
          godot --headless --verbose --export-debug Android build/DeadZoneMobile-2.0.apk >> build/export.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeadZoneMobile-2.0-APK
          path: v2/build/
